<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <script src="https://kit.fontawesome.com/2c9e17b860.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css"/>
    <title>Hotell | Avaleht</title>
</head>
<body>
    <header>
        <nav id="navbar">
            <div class="container">
                <h1><a href="index.html">VOCO</a></h1>
                <ul>
                    <li><a href="index.html">Avaleht</a></li>
                    <li><a href="about.html">Kirjeldus</a></li>
                    <li><a href="contact.html">Kontakt</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <section id="contact-form" class="py-30">
        <div class="container">
            <h1>Võta <span class="text-primary">Ühendust</span> Meiega</h1>
            <p>Palun täida all olev vorm</p>
            <form action="">
                <div class="form-group">
                    <label for="Name">Nimi</label>
                    <input type="text" id="name">
                </div>
                <div class="form-group">
                    <label for="Email">Email</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label for="Message">Sõnum</label>
                    <textarea id="message"></textarea>
                </div>

                <button type="submit" class="btn">Saada</button>
            </form>
        </div>
    </section>
    <section id="contact-info" class="bg-dark">
        <div class="container">
            <div class="box bg-dark">
                <h3>Aadress</h3>
                <p>Kopli 1A, Tartu</p>
            </div>
            <div class="box bg-dark">
                <h3>Telefon</h3>
                <p>5555 5555</p>
            </div>
            <div class="box bg-dark">
                <h3>Email</h3>
                <p>info@voco.ee</p>
            </div>
        </div>
    </section>

    <div class="clear"></div>
    <footer>
        <p>VOCO &copy;2026, Kõik Õigused On Kaitstud</p>
    </footer>
    
</body>
</html>
